name: CI

on:
  push:
    branches:
      - 'dev/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test

  open-pr:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH_NAME: ${{ github.ref_name }}
    steps:
      - name: Open pull request
        run: |
          existing_pr=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number')
          if [ -z "$existing_pr" ]; then
            gh pr create --base main --head "$BRANCH_NAME" --title "Integrate $BRANCH_NAME" --body "Automatically opened after successful CI checks for $BRANCH_NAME."
          else
            echo "Pull request #$existing_pr is already open."
          fi
